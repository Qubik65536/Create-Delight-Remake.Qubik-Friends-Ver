# Qubik Friends Ver — Mod & Resource Pack Patch Configuration
# =============================================================
# This file declares the modifications applied on top of the upstream
# Create-Delight-Remake `release` branch when building the Qubik Friends version.
#
# Top-level fields:
#
#   game_version (optional) — the Minecraft game version this patch targets
#                             (e.g. "1.20.1").
#                             When set, any [[mods.add]], [[mods.substitute]], or
#                             [[resourcepacks.add]] entry that has no explicit
#                             `version` field will fetch the **latest file that
#                             supports this game version** instead of the globally
#                             latest file.
#                             Entries with an explicit `version` are unaffected.
#
#   modloader    (required) — the mod loader this patch targets.
#                             Accepted values: "forge", "neoforge", "fabric",
#                             "quilt" (any value the platform uses).
#                             When a mod/resource-pack entry has no explicit
#                             `version`, only files compatible with this loader
#                             are considered. Entries with an explicit `version`
#                             are unaffected.
#
# Supported operations:
#
#   [[assets]]
#     src    (required) — source directory path, relative to the assets/ directory
#     dest   (required) — destination path relative to the modpack directory
#     mode   (optional) — "merge" (default) or "replace"
#                           merge:   copy files on top of any existing content
#                           replace: delete dest entirely first, then copy
#     reason (optional) — human-readable description
#
#   [[mods.remove]]
#     pattern  (required) — glob matched against filenames in mods/
#     reason   (optional) — human-readable description
#
#   [[mods.add]]
#   [[mods.substitute]]   (substitute also requires remove_pattern)
#   [[resourcepacks.add]]
#
#   All [[mods.add]] and [[mods.substitute]] entries support optional fields:
#     clientonly (optional) — true/false (default: false)
#                             When true, the mod's identifier is automatically
#                             appended to .clientonlymodlist (in the same directory
#                             as patches.toml) if not already present.
#                             Identifier used: the canonical modrinth project slug
#                             (resolved from the API, so both IDs and slugs work) for
#                             modrinth entries, or the resolved filename without the
#                             .jar extension for curseforge/url entries.
#     serveronly (optional) — true/false (default: false)
#                             When true, the mod's resolved download URL is
#                             automatically appended to .serveronlymodlist (in the
#                             same directory as patches.toml) if not already present
#                             (one URL per line).
#
#   Each download entry supports three mutually exclusive source types:
#
#   Source 1 — Direct URL:
#     url      (required) — direct download URL for the file
#     filename (required) — destination filename
#
#   Source 2 — Modrinth (uses ferinth; no API key needed):
#     modrinth (required) — Modrinth project slug or ID (e.g. "sodium" or "AANobbMI")
#                           Both forms are accepted; when clientonly = true the canonical
#                           slug is resolved from the API and written to .clientonlymodlist.
#     version  (optional) — exact version_number to download (e.g. "mc1.20.1-0.5.8")
#                           omit or set to "latest" to use the newest version
#     filename (optional) — override the filename from the API
#
#   Source 3 — CurseForge (uses furse; requires CURSEFORGE_API_KEY env var):
#     curseforge (required) — CurseForge project ID (integer, e.g. 238222)
#     version    (optional) — substring matched against the file's display name
#                             omit or set to "latest" to use the newest file
#     filename   (optional) — override the filename from the API
#
#   [[mods.substitute]] additional field:
#     remove_pattern (required) — glob matched against filenames in mods/
#
#   [[resourcepacks.remove]]
#     pattern  (required) — glob matched against filenames in resourcepacks/
#     reason   (optional) — human-readable description
#
# Overlay files (configs, KubeJS scripts, etc.) go in the overlay/ directory —
# they are copied on top of the upstream checkout before patches are applied.
# Asset directories go in the assets/ directory — each [[assets]] entry maps a
# named subdirectory in assets/ to a destination path in the modpack.
# ---------------------------------------------------------------------------

game_version = "1.20.1"
modloader    = "forge"

# ---------------------------------------------------------------------------
# Asset copies
# ---------------------------------------------------------------------------
# [[assets]]
# src    = "my-textures"                    # maps to assets/my-textures/
# dest   = "resourcepacks/MyPack/assets"    # relative to the modpack directory
# mode   = "replace"                        # "merge" (default), "replace", or "delete"
# reason = "Our custom textures for MyPack"

[[assets]]
src    = "tacz"
dest   = "tacz"
mode   = "replace"
reason = "More Gun Packs w/ Modded Elements"

[[assets]]
src    = "."
dest   = "hotai/com/tacz"
mode   = "delete"
reason = "This official hotai patch to tacz can no longer be applied."

# ---------------------------------------------------------------------------
# Mod removals
# ---------------------------------------------------------------------------
# [[mods.remove]]
# pattern = "some-problematic-mod-*.jar"
# reason  = "Causes crash on startup with our KubeJS scripts"

# Accelerated Rendering
[[mods.remove]]
pattern = "acceleratedrendering-*.jar"
reason  = "Causes crash on startup on macOS"

# ---------------------------------------------------------------------------
# Mod additions
# ---------------------------------------------------------------------------

# Direct URL:
# [[mods.add]]
# url        = "https://example.com/releases/my-mod-1.0.0.jar"
# filename   = "my-mod-1.0.0.jar"
# clientonly = true
# reason     = "Adds QoL feature X for our group (client-only)"

# Modrinth (latest version):
# [[mods.add]]
# modrinth   = "sodium"
# clientonly = true
# reason     = "Adds sodium (client-only)"

# Modrinth (pinned version):
# [[mods.add]]
# modrinth   = "sodium"
# version    = "mc1.20.1-0.5.8"
# clientonly = true
# reason     = "Pinned sodium for compatibility (client-only)"

# CurseForge (latest version, requires CURSEFORGE_API_KEY):
# [[mods.add]]
# curseforge = 238222
# reason     = "Adds JEI"

# CurseForge (pinned version):
# [[mods.add]]
# curseforge = 238222
# version    = "19.7.0.5"
# reason     = "Pinned JEI version"

